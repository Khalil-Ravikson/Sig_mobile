name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifica se o projeto Flutter já existe
        id: tem_projeto
        run: |
          if [ -f pubspec.yaml ]; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "existe=false" >> "$GITHUB_OUTPUT"; fi

      - uses: subosito/flutter-action@v2
        if: steps.tem_projeto.outputs.existe == 'true'
        with:
          channel: stable
          cache: true

      - name: Dependências
        if: steps.tem_projeto.outputs.existe == 'true'
        run: flutter pub get

      - name: Gerar código (build_runner)
        if: steps.tem_projeto.outputs.existe == 'true'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Formatação
        if: steps.tem_projeto.outputs.existe == 'true'
        run: dart format --output=none --set-exit-code .

      - name: Análise estática
        if: steps.tem_projeto.outputs.existe == 'true'
        run: flutter analyze

      - name: Testes
        if: steps.tem_projeto.outputs.existe == 'true'
        run: flutter test
